<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#02050A; font-family:'Inter', sans-serif;">
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#02050A" />
            <stop offset="100%" stop-color="#0D1B2A" />
        </linearGradient>
        <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00F2FE" />
            <stop offset="100%" stop-color="#4FACFE" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <rect width="1440" height="900" fill="url(#bg-grad)" />

    <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
        <line x1="100" y1="0" x2="100" y2="900"/>
        <line x1="300" y1="0" x2="300" y2="900"/>
        <line x1="720" y1="0" x2="720" y2="900"/>
        <line x1="1140" y1="0" x2="1140" y2="900"/>
        <line x1="0" y1="120" x2="1440" y2="120"/>
        <line x1="0" y1="450" x2="1440" y2="450"/>
    </g>

    <text x="100" y="75" fill="#FFFFFF" font-size="20" font-weight="800" letter-spacing="2">AIRPORT DIRECT v2.0</text>
    <text x="100" y="95" fill="#4FACFE" font-size="11" font-weight="600" letter-spacing="1">PASSENGER JOURNEY DASHBOARD</text>

    <rect x="940" y="55" width="400" height="50" rx="12" fill="#0E2138" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <circle cx="975" cy="80" r="6" fill="#00F2FE" filter="url(#glow)"/>
    <text x="995" y="84" fill="#FFFFFF" font-size="13" font-weight="600">Terminal 2 - Active Status OK</text>
    <text x="1240" y="84" fill="#A1A1AA" font-size="12" font-weight="500">Departures 48 min</text>

    <g transform="translate(100, 160)">
        <rect width="600" height="640" rx="20" fill="#071221" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <text x="40" y="50" fill="#FFFFFF" font-size="20" font-weight="700">Scheduled Departures</text>
        <text x="40" y="80" fill="#A1A1AA" font-size="12" font-weight="500">Live flight sync gate wayfinding</text>
        
        <g transform="translate(40, 120)" font-size="14" fill="#FFFFFF">
            <text x="0" y="0" fill="#A1A1AA" font-size="12" font-weight="600">FLIGHT</text>
            <text x="120" y="0" fill="#A1A1AA" font-size="12" font-weight="600">DESTINATION</text>
            <text x="280" y="0" fill="#A1A1AA" font-size="12" font-weight="600">TIME</text>
            <text x="380" y="0" fill="#A1A1AA" font-size="12" font-weight="600">GATE</text>
            <text x="460" y="0" fill="#A1A1AA" font-size="12" font-weight="600">STATUS</text>
            
            <line x1="0" y1="15" x2="520" y2="15" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
            
            <g transform="translate(0, 45)">
                <text x="0" y="0" font-weight="700">EK-501</text>
                <text x="120" y="0">Dubai Int (DXB)</text>
                <text x="280" y="0">14:20</text>
                <text x="380" y="0">Gate B-12</text>
                <rect x="460" y="-12" width="60" height="20" rx="10" fill="rgba(34, 197, 94, 0.15)"/>
                <text x="472" y="2" fill="#22C55E" font-size="11" font-weight="700">BOARDING</text>
            </g>
            <g transform="translate(0, 105)">
                <text x="0" y="0" font-weight="700">AI-120</text>
                <text x="120" y="0">London Heathrow</text>
                <text x="280" y="0">15:05</text>
                <text x="380" y="0">Gate A-04</text>
                <rect x="460" y="-12" width="60" height="20" rx="10" fill="rgba(0, 242, 254, 0.15)"/>
                <text x="472" y="2" fill="#00F2FE" font-size="11" font-weight="700">ON TIME</text>
            </g>
            <g transform="translate(0, 165)">
                <text x="0" y="0" font-weight="700">SQ-421</text>
                <text x="120" y="0">Singapore Changi</text>
                <text x="280" y="0">15:40</text>
                <text x="380" y="0">Gate C-18</text>
                <rect x="460" y="-12" width="60" height="20" rx="10" fill="rgba(0, 242, 254, 0.15)"/>
                <text x="472" y="2" fill="#00F2FE" font-size="11" font-weight="700">ON TIME</text>
            </g>
            <g transform="translate(0, 225)">
                <text x="0" y="0" font-weight="700">LH-756</text>
                <text x="120" y="0">Frankfurt Main</text>
                <text x="280" y="0">16:15</text>
                <text x="380" y="0">Gate B-08</text>
                <rect x="460" y="-12" width="60" height="20" rx="10" fill="rgba(239, 68, 68, 0.15)"/>
                <text x="472" y="2" fill="#EF4444" font-size="11" font-weight="700">DELAYED</text>
            </g>
        </g>
    </g>

    <g transform="translate(740, 160)">
        <rect width="600" height="640" rx="20" fill="#071221" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <text x="40" y="50" fill="#FFFFFF" font-size="20" font-weight="700">Terminal Wayfinding Radar</text>
        
        <g transform="translate(300, 340)">
            <circle cx="0" cy="0" r="100" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
            <circle cx="0" cy="0" r="200" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
            <line x1="-240" y1="0" x2="240" y2="0" stroke="rgba(255,255,255,0.03)"/>
            <line x1="0" y1="-240" x2="0" y2="240" stroke="rgba(255,255,255,0.03)"/>
            
            <line x1="0" y1="0" x2="140" y2="-140" stroke="url(#cyan-grad)" stroke-width="2" filter="url(#glow)"/>
            
            <g transform="translate(-100, -80)">
                <circle cx="0" cy="0" r="8" fill="#4FACFE" filter="url(#glow)"/>
                <text x="14" y="5" fill="#FFFFFF" font-size="11" font-weight="600">Gate A</text>
            </g>
            <g transform="translate(120, 90)">
                <circle cx="0" cy="0" r="8" fill="#4FACFE" filter="url(#glow)"/>
                <text x="14" y="5" fill="#FFFFFF" font-size="11" font-weight="600">Security Check</text>
            </g>
            <g transform="translate(40, -160)">
                <circle cx="0" cy="0" r="8" fill="#00F2FE" filter="url(#glow)"/>
                <text x="14" y="5" fill="#FFFFFF" font-size="11" font-weight="600">Gate B-12 (Boarding)</text>
            </g>
        </g>
    </g>
</svg>