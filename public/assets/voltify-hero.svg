<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#0F0F1A; font-family:'Inter', sans-serif;">
    <defs>
        <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4F46E5" />
            <stop offset="50%" stop-color="#7C3AED" />
            <stop offset="100%" stop-color="#06B6D4" />
        </linearGradient>
        <radialGradient id="radial-glow" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#0F0F1A" stop-opacity="0" />
        </radialGradient>
        <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="10" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <rect width="390" height="844" fill="#0F0F1A"/>
    <circle cx="195" cy="350" r="250" fill="url(#radial-glow)" />
    
    <text x="32" y="38" fill="#FFFFFF" font-size="14" font-weight="600" opacity="0.9">9:41</text>
    <g transform="translate(310, 26)">
        <rect x="0" y="0" width="22" height="12" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
        <rect x="2" y="2" width="14" height="8" rx="1.5" fill="#22C55E"/>
        <path d="M 23 4 L 23 8" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
    </g>

    <text x="32" y="90" fill="#FFFFFF" font-size="20" font-weight="800" letter-spacing="-0.5">Voltify</text>
    <text x="32" y="110" fill="#A1A1AA" font-size="12" font-weight="500">EV SMART CHARGING</text>
    
    <g transform="translate(32, 140)">
        <rect width="326" height="200" rx="20" fill="#181826" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <path d="M 20 50 Q 150 20 306 90" stroke="rgba(255,255,255,0.08)" stroke-width="4" fill="none"/>
        <path d="M 50 180 C 120 120 180 80 280 40" stroke="rgba(255,255,255,0.08)" stroke-width="4" fill="none"/>
        <path d="M 160 0 L 160 200" stroke="rgba(255,255,255,0.05)" stroke-width="2" fill="none"/>
        
        <circle cx="180" cy="110" r="16" fill="#7C3AED" opacity="0.3" filter="url(#glow-effect)"/>
        <circle cx="180" cy="110" r="6" fill="#FFFFFF" />
        <circle cx="100" cy="60" r="10" fill="#4F46E5" opacity="0.4"/>
        <circle cx="100" cy="60" r="4" fill="#4F46E5" />
        
        <text x="20" y="180" fill="#FFFFFF" font-size="12" font-weight="600">Ahmedabad Station A-4</text>
        <text x="240" y="180" fill="#22C55E" font-size="12" font-weight="600">3/4 Free</text>
    </g>

    <g transform="translate(195, 480)">
        <circle cx="0" cy="0" r="90" fill="none" stroke="rgba(79, 70, 229, 0.1)" stroke-width="8" />
        <circle cx="0" cy="0" r="90" fill="none" stroke="url(#glow-grad)" stroke-width="8" stroke-dasharray="450 120" stroke-linecap="round" transform="rotate(-90)" filter="url(#glow-effect)"/>
        
        <path d="M -15 -35 L -5 -35 L -5 -40 L 5 -40 L 5 -35 L 15 -35 L 15 5 L -15 5 Z" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
        <rect x="-10" y="-20" width="20" height="20" fill="url(#glow-grad)" opacity="0.8"/>
        
        <text x="0" y="30" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="800">82%</text>
        <text x="0" y="50" text-anchor="middle" fill="#06B6D4" font-size="11" font-weight="600" letter-spacing="1">CHARGING</text>
    </g>

    <g transform="translate(32, 610)">
        <g transform="translate(0, 0)">
            <rect width="150" height="80" rx="16" fill="#181826" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
            <text x="16" y="30" fill="#A1A1AA" font-size="11" font-weight="600">DELIVERED</text>
            <text x="16" y="56" fill="#FFFFFF" font-size="20" font-weight="700">32.4 kWh</text>
        </g>
        <g transform="translate(176, 0)">
            <rect width="150" height="80" rx="16" fill="#181826" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
            <text x="16" y="30" fill="#A1A1AA" font-size="11" font-weight="600">TIME REMAINING</text>
            <text x="16" y="56" fill="#FFFFFF" font-size="20" font-weight="700">14 min</text>
        </g>
    </g>

    <g transform="translate(32, 720)">
        <rect width="326" height="56" rx="28" fill="url(#glow-grad)" filter="url(#glow-effect)"/>
        <text x="163" y="34" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">Stop Charging</text>
    </g>
</svg>