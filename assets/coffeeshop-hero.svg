<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#090605; font-family:'Inter', sans-serif;">
    <defs>
        <radialGradient id="coffee-glow" cx="80%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#C58F67" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#090605" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F5E6D3" />
            <stop offset="50%" stop-color="#C58F67" />
            <stop offset="100%" stop-color="#8E5A36" />
        </linearGradient>
        <filter id="glow-effect-coffee" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <rect width="1440" height="900" fill="#090605" />
    <circle cx="1100" cy="450" r="500" fill="url(#coffee-glow)" />

    <g opacity="0.03" stroke="#FFFFFF" stroke-width="1">
        <line x1="120" y1="0" x2="120" y2="900"/>
        <line x1="480" y1="0" x2="480" y2="900"/>
        <line x1="960" y1="0" x2="960" y2="900"/>
        <line x1="1320" y1="0" x2="1320" y2="900"/>
        <line x1="0" y1="180" x2="1440" y2="180"/>
        <line x1="0" y1="720" x2="1440" y2="720"/>
    </g>

    <text x="120" y="90" fill="#FFFFFF" font-size="20" font-weight="800" letter-spacing="-1">NeroBean.</text>
    <g transform="translate(600, 75)" font-size="14" font-weight="600" fill="#A1A1AA">
        <text x="0" y="10" fill="#FFFFFF">Home</text>
        <text x="80" y="10">Our Roastery</text>
        <text x="200" y="10">Specials</text>
        <text x="300" y="10">Order</text>
    </g>
    <rect x="1200" y="60" width="120" height="40" rx="20" fill="none" stroke="#C58F67" stroke-width="1"/>
    <text x="1260" y="84" text-anchor="middle" fill="#C58F67" font-size="13" font-weight="700">Find Roasters</text>

    <g transform="translate(120, 280)">
        <text x="0" y="0" fill="#C58F67" font-size="14" font-weight="700" letter-spacing="3" opacity="0.8">CRAFTED IN SMALL BATCHES</text>
        <text x="0" y="70" fill="url(#gold-grad)" font-size="64" font-weight="900" letter-spacing="-2">The Art of Pure Espresso</text>
        <text x="0" y="150" fill="#A1A1AA" font-size="16" font-weight="400" width="400" opacity="0.9">
            Slow roasted, ethically sourced, and meticulously brewed. NeroBean introduces a sensory<br/>
            revolution, crafting premium coffee rituals for the creative technologist.
        </text>

        <g transform="translate(0, 230)">
            <rect width="180" height="56" rx="28" fill="#C58F67" />
            <text x="90" y="33" text-anchor="middle" fill="#090605" font-size="14" font-weight="700">Explore Brews</text>
        </g>
    </g>

    <g transform="translate(820, 220)">
        <rect x="20" y="20" width="500" height="460" rx="32" fill="#000000" opacity="0.5" filter="url(#glow-effect-coffee)"/>
        <rect width="500" height="460" rx="32" fill="#181412" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        
        <circle cx="250" cy="200" r="120" fill="#251B14" stroke="#C58F67" stroke-width="4"/>
        <circle cx="250" cy="200" r="100" fill="#160F0B" />
        <path d="M 250 150 C 290 150 320 200 250 250 C 180 300 210 250 250 200" stroke="#F5E6D3" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.85"/>
        
        <rect x="40" y="350" width="420" height="80" rx="20" fill="rgba(9,6,5,0.8)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="68" y="396" fill="#F5E6D3" font-size="20" font-weight="700">Espresso Macchiato</text>
        <text x="380" y="396" fill="#C58F67" font-size="18" font-weight="800">$6.50</text>
        <text x="68" y="416" fill="#A1A1AA" font-size="11" font-weight="500">100% ETHIOPIAN ARABICA • STEAMED NERO FOAM</text>
    </g>
</svg>